<!DOCTYPE html>
<html>
<head>
  <base href="https://websim.ai/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-layout">
    <!-- Left Sidebar: Agents & Nav -->
    <div id="sidebar-container" class="layout-sidebar"></div>
    
    <!-- Center: Workspace (Code & Preview) -->
    <div id="workspace-container" class="layout-main"></div>
    
    <!-- Right Panel: Chat & Interaction -->
    <div class="layout-chat">
      <div class="chat-header">
        <h2>Team Chat</h2>
        <div class="thinking">Working<span class="thinking-dots"></span></div>
      </div>
      
      <div id="chat-container">
        <div id="chat"></div>
      </div>
      
      <div class="chat-input-area">
        <div class="progress-bar">
          <div class="progress"></div>
        </div>
        <div class="input-wrapper">
          <textarea id="prompt" rows="1" placeholder="Describe your app..."></textarea>
          <button id="generateBtn" title="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="modals-container"></div>

  <!-- Script imports -->
  <script src="js/components.js"></script>
  <script src="js/room.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/codeVersion.js"></script>
  <script src="js/main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
