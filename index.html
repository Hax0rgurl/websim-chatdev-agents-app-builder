<html>
<head>
  <title>ChatDev Agents App Builder</title>
  <base href="https://websim.ai/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Including Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* Reset and basic styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Gradient background animation */
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      font-family: 'Inter', sans-serif;
      color: #fff;
      line-height: 1.6;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
      padding: 20px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    p {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 20px;
      text-align: center;
    }

    #prompt, #urlInput {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      resize: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    #prompt::placeholder, #urlInput::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    #generateBtn, #loadUrlBtn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: rgba(35, 166, 213, 0.8);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-bottom: 20px;
    }

    #generateBtn:hover, #loadUrlBtn:hover {
      background: rgba(35, 166, 213, 1);
    }

    #loading {
      display: none;
      margin-top: 10px;
      text-align: center;
    }

    #output {
      margin-top: 20px;
    }

    /* Scrollbar styling for iframe content */
    #appFrame, #browserFrame {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 12px;
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
      }
      #appFrame, #browserFrame {
        height: 400px;
      }
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>ChatDev Agents App Builder</h1>
    <p>Type in a prompt, and autonomous agents will create a fully functional web application based on your idea.</p>
    <textarea id="prompt" rows="5" placeholder="Enter your prompt here..."></textarea>
    <button id="generateBtn">Generate App</button>
    <p id="loading">Generating your app...</p>
    <div id="output"></div>
    <h2>Browser</h2>
    <input type="text" id="urlInput" placeholder="Enter URL to load...">
    <button id="loadUrlBtn">Load URL</button>
    <iframe id="browserFrame"></iframe>
  </div>
  <script>
    document.getElementById('generateBtn').addEventListener('click', async function() {
      const promptText = document.getElementById('prompt').value.trim();
      if (!promptText) {
        alert('Please enter a prompt.');
        return;
      }
      document.getElementById('loading').style.display = 'block';
      document.getElementById('output').innerHTML = '';
      try {
        const response = await fetch('/api/ai_completion', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
          },
          body: JSON.stringify({ 
            prompt: `As the "Programmer" agent, generate a complete HTML file based on the user's task: "{task}". Make sure all JavaScript and CSS are inlined within the HTML file. The code should begin with "<html>" and end with "</html>". Do not include any explanations or comments outside of the code.`,
            data: {
              task: promptText
            }
          }),
        });
        const data = await response.json();
        const generatedCode = data.completion;
        document.getElementById('output').innerHTML = '<iframe id="appFrame"></iframe>';
        const appFrame = document.getElementById('appFrame');
        const appDoc = appFrame.contentWindow.document;
        appDoc.open();
        appDoc.write(generatedCode);
        appDoc.close();
      } catch (error) {
        console.error('Error generating app:', error);
        alert('An error occurred while generating the app.');
      }
      document.getElementById('loading').style.display = 'none';
    });

    document.getElementById('loadUrlBtn').addEventListener('click', function() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) {
        alert('Please enter a URL.');
        return;
      }
      const browserFrame = document.getElementById('browserFrame');
      browserFrame.src = url;
    });
  </script>

</body>
</html>
