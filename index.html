<html><head><base href="https://websim.ai/"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><style>*{box-sizing:border-box;margin:0;padding:0}@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}body{font-family:'Inter',sans-serif;color:#fff;line-height:1.6;background:linear-gradient(-45deg,#1a1c2c,#2a2d4f,#2c3e50,#3498db);background-size:400% 400%;animation:gradient 15s ease infinite;min-height:100vh;display:flex;justify-content:center;align-items:center}.container{max-width:1200px;width:100%;padding:20px;background:rgba(0,0,0,0.4);border-radius:12px;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,0.1)}.grid{display:grid;grid-template-columns:300px 1fr;gap:20px}.sidebar{background:rgba(0,0,0,0.2);padding:15px;border-radius:8px}.main-content{display:flex;flex-direction:column;gap:20px}h1{font-size:24px;font-weight:600;margin-bottom:20px;text-shadow:2px 2px 4px rgba(0,0,0,0.2)}.agent{padding:10px;background:rgba(255,255,255,0.1);border-radius:6px;margin-bottom:10px;transition:all 0.3s}.agent.active{background:rgba(52,152,219,0.3);transform:translateX(5px)}.agent-name{font-weight:600;color:#3498db}.agent-role{font-size:12px;opacity:0.8}#chat{height:400px;background:rgba(255,255,255,0.1);border-radius:8px;padding:15px;overflow-y:auto}#chat p{margin-bottom:10px;padding:8px 12px;border-radius:6px;max-width:80%}#chat .user{background:rgba(52,152,219,0.3);margin-left:auto}#chat .ai{background:rgba(255,255,255,0.1)}#prompt{width:100%;padding:12px;border:none;border-radius:8px;font-size:16px;resize:none;background:rgba(255,255,255,0.1);color:#fff;margin-bottom:10px}#prompt::placeholder{color:rgba(255,255,255,0.7)}#generateBtn{width:100%;padding:12px;border:none;border-radius:8px;background:rgba(52,152,219,0.8);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.3s}#generateBtn:hover{background:rgba(52,152,219,1)}#output{width:100%;height:400px;border:none;border-radius:8px;background:rgba(0,0,0,0.2)}.thinking{display:none;color:#3498db;font-style:italic;margin:10px 0}.progress-bar{height:2px;background:rgba(52,152,219,0.3);border-radius:1px;overflow:hidden}.progress{height:100%;width:0%;background:#3498db;transition:width 0.3s}@keyframes typing{0%{opacity:0.3}50%{opacity:1}100%{opacity:0.3}}.thinking-dots::after{content:'...';animation:typing 1.5s infinite}</style></head><body><div class="container"><div class="grid"><div class="sidebar"><h1>Development Team</h1><div class="agent" data-role="project-manager"><div class="agent-name">Sarah Chen</div><div class="agent-role">Project Manager</div></div><div class="agent" data-role="product-owner"><div class="agent-name">Michael Rodriguez</div><div class="agent-role">Product Owner</div></div><div class="agent" data-role="lead-developer"><div class="agent-name">James Wilson</div><div class="agent-role">Lead Developer</div></div><div class="agent" data-role="developer"><div class="agent-name">Emily Zhang</div><div class="agent-role">Developer</div></div><div class="agent" data-role="code-reviewer"><div class="agent-name">David Kumar</div><div class="agent-role">Code Reviewer</div></div><div class="agent" data-role="qa-engineer"><div class="agent-name">Lisa Patel</div><div class="agent-role">QA Engineer</div></div><div class="agent" data-role="designer"><div class="agent-name">Alex Morgan</div><div class="agent-role">UX/UI Designer</div></div><div class="agent" data-role="devops"><div class="agent-name">Sam Taylor</div><div class="agent-role">DevOps Engineer</div></div></div><div class="main-content"><div id="chat"></div><div class="thinking">Team is collaborating<span class="thinking-dots"></span></div><div class="progress-bar"><div class="progress"></div></div><textarea id="prompt" rows="3" placeholder="Describe what you'd like to build..."></textarea><button id="generateBtn">Send Message</button><iframe id="output"></iframe></div></div></div><script>const chat=document.getElementById('chat');const thinking=document.querySelector('.thinking');const progress=document.querySelector('.progress');const promptInput=document.getElementById('prompt');const outputFrame=document.getElementById('output');let conversation=[];let currentAgent='product-owner';let progress_value=0;let autoConversationTimeout;let isAutoConversing=false;function updateProgress(value){progress.style.width=`${value}%`;progress_value=value}function highlightAgent(role){document.querySelectorAll('.agent').forEach(a=>a.classList.remove('active'));document.querySelector(`[data-role="${role}"]`).classList.add('active')}async function addMessage(text,sender='user'){const p=document.createElement('p');p.className=sender;p.textContent=text;chat.appendChild(p);chat.scrollTop=chat.scrollHeight;conversation.push({role:sender==='user'?'user':'assistant',content:text,agent:sender==='user'?'user':currentAgent})}async function generateResponse(userMessage,isAuto=false){thinking.style.display='block';updateProgress(0);try{const response=await fetch('/api/ai_completion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:`You are a collaborative team of AI development agents working together to build web applications. Each agent has a specific role and responsibilities. Your responses should show active collaboration, reviewing and correcting each other's work. Agents must actively engage with each other, critique decisions, suggest improvements, and work towards a final product.\n\nCurrent agent: ${currentAgent}\n\nPrevious conversation context:\n${conversation.map(msg=>`${msg.role} (${msg.agent}): ${msg.content}`).join('\n')}\n\n<format>\nRespond as the current agent, actively engaging with previous messages and other team members. Review and comment on previous work, suggest improvements, and maintain natural team dynamics. Be critical when necessary and supportive when appropriate. Include your response in this format:\n\n{\n  "reply": "Your message here, including feedback on previous messages and collaboration with team",\n  "code": "<html>...</html>",  // only include if generating/modifying code\n  "next_agent": "role-name",   // specify which agent should respond next based on the conversation\n  "progress": 25,              // estimated progress 0-100\n  "continue": true            // whether the agents should continue discussing (false when complete)\n}\n</format>`,data:userMessage})});const data=await response.json();if(data.code){outputFrame.style.display='block';const appDoc=outputFrame.contentWindow.document;appDoc.open();appDoc.write(data.code);appDoc.close()}if(data.next_agent){currentAgent=data.next_agent;highlightAgent(currentAgent)}if(data.progress){updateProgress(data.progress)}await addMessage(data.reply,'ai');if(isAuto&&data.continue){autoConversationTimeout=setTimeout(()=>{if(isAutoConversing){generateResponse("",true)}},2000)}}catch(error){await addMessage('Sorry, I encountered an error. Please try again.','ai');isAutoConversing=false}thinking.style.display='none'}document.getElementById('generateBtn').addEventListener('click',async function(){const promptText=promptInput.value.trim();if(!promptText)return;clearTimeout(autoConversationTimeout);isAutoConversing=true;await addMessage(promptText);promptInput.value='';await generateResponse(promptText,true)});promptInput.addEventListener('keypress',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('generateBtn').click()}});highlightAgent(currentAgent);</script><script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body></html>
