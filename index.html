<html><head><base href="https://websim.ai/"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><style>*{box-sizing:border-box;margin:0;padding:0}@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}body{font-family:'Inter',sans-serif;color:#fff;line-height:1.6;background:linear-gradient(-45deg,#ee7752,#e73c7e,#23a6d5,#23d5ab);background-size:400% 400%;animation:gradient 15s ease infinite;min-height:100vh;display:flex;justify-content:center;align-items:center}.container{max-width:800px;width:100%;padding:20px;background:rgba(0,0,0,0.4);border-radius:12px;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,0.1)}h1{font-size:32px;font-weight:600;margin-bottom:20px;text-align:center;text-shadow:2px 2px 4px rgba(0,0,0,0.2)}p{font-size:16px;opacity:0.9;margin-bottom:20px;text-align:center}#prompt{width:100%;padding:10px;border:none;border-radius:8px;font-size:16px;margin-bottom:20px;resize:none;background:rgba(255,255,255,0.1);color:#fff}#prompt::placeholder{color:rgba(255,255,255,0.7)}#generateBtn{width:100%;padding:12px;border:none;border-radius:8px;background:rgba(35,166,213,0.8);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.3s;margin-bottom:20px}#generateBtn:hover{background:rgba(35,166,213,1)}#loading{display:none;margin-top:10px;text-align:center}#output{margin-top:20px}#appFrame{width:100%;height:600px;border:none;border-radius:12px;overflow:hidden}@media (max-width:600px){.container{margin:20px}#appFrame{height:400px}}</style></head><body><div class="container"><h1>ChatDev Agents App Builder</h1><p>Type in a prompt, and autonomous agents will create a fully functional web application based on your idea.</p><textarea id="prompt" rows="5" placeholder="Enter your prompt here..."></textarea><button id="generateBtn">Generate App</button><p id="loading">Generating your app...</p><div id="output"></div></div><script>document.getElementById('generateBtn').addEventListener('click',async function(){const promptText=document.getElementById('prompt').value.trim();if(!promptText){alert('Please enter a prompt.');return}document.getElementById('loading').style.display='block';document.getElementById('output').innerHTML='';try{const response=await fetch('/api/ai_completion',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json',},body:JSON.stringify({prompt:`As the "Programmer" agent, generate a complete, tested, and fully functional HTML file based on the user's task: "{task}". Ensure that the code is tested, and redo it if it is incomplete or has errors. Use appropriate JavaScript libraries as needed to implement the required functionality. Make sure all JavaScript and CSS are inlined within the HTML file. The code should begin with "<html>" and end with "</html>". Do not include any explanations or comments outside of the code.`,data:{task:promptText}}),});const data=await response.json();const generatedCode=data.final_deliverable;document.getElementById('output').innerHTML='<iframe id="appFrame"></iframe>';const appFrame=document.getElementById('appFrame');const appDoc=appFrame.contentWindow.document;appDoc.open();appDoc.write(generatedCode);appDoc.close()}catch(error){console.error('Error generating app:',error);alert('An error occurred while generating the app.')}document.getElementById('loading').style.display='none'});</script><script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body></html>
