<html><head><base href="https://websim.ai/"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><style>*{box-sizing:border-box;margin:0;padding:0}@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}body{font-family:'Inter',sans-serif;color:#fff;line-height:1.6;background:linear-gradient(-45deg,#ee7752,#e73c7e,#23a6d5,#23d5ab);background-size:400% 400%;animation:gradient 15s ease infinite;min-height:100vh;display:flex;justify-content:center;align-items:center}.container{max-width:800px;width:100%;padding:20px;background:rgba(0,0,0,0.4);border-radius:12px;backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,0.1)}h1{font-size:32px;font-weight:600;margin-bottom:20px;text-align:center;text-shadow:2px 2px 4px rgba(0,0,0,0.2)}p{font-size:16px;opacity:0.9;margin-bottom:20px;text-align:center}#prompt{width:100%;padding:10px;border:none;border-radius:8px;font-size:16px;margin-bottom:20px;resize:none;background:rgba(255,255,255,0.1);color:#fff}#prompt::placeholder{color:rgba(255,255,255,0.7)}#generateBtn{width:100%;padding:12px;border:none;border-radius:8px;background:rgba(35,166,213,0.8);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.3s;margin-bottom:20px}#generateBtn:hover{background:rgba(35,166,213,1)}#loading{display:none;margin-top:10px;text-align:center}#output{margin-top:20px}#appFrame{width:100%;height:600px;border:none;border-radius:12px;overflow:hidden;display:none}#chat{width:100%;height:200px;background:rgba(255,255,255,0.1);border-radius:8px;padding:10px;margin-bottom:20px;overflow-y:auto}#chat p{text-align:left;margin-bottom:10px}#chat .ai{color:#23d5ab}#chat .user{color:#fff}.thinking{display:none;margin:10px 0;font-style:italic;color:rgba(255,255,255,0.7)}@media (max-width:600px){.container{margin:20px}#appFrame{height:400px}}</style></head><body><div class="container"><h1>ChatDev Agents App Builder</h1><p>Talk with the AI and watch as it builds your application in real-time.</p><div id="chat"></div><p class="thinking">AI is thinking...</p><textarea id="prompt" rows="3" placeholder="Chat with the AI..."></textarea><button id="generateBtn">Send Message</button><div id="output"><iframe id="appFrame"></iframe></div></div><script>const chat=document.getElementById('chat');const thinking=document.querySelector('.thinking');const promptInput=document.getElementById('prompt');const appFrame=document.getElementById('appFrame');let conversation=[];async function addMessage(text,sender='user'){const p=document.createElement('p');p.className=sender;p.textContent=text;chat.appendChild(p);chat.scrollTop=chat.scrollHeight;conversation.push({role:sender==='user'?'user':'assistant',content:text})}async function generateResponse(userMessage){thinking.style.display='block';try{const response=await fetch('/api/ai_completion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:`You are a friendly AI assistant helping users create web applications. Reply conversationally and help guide them through the process.
Previous conversation:
${conversation.map(msg=>`${msg.role}: ${msg.content}`).join('\n')}

<format>
Respond naturally to continue the conversation. If the user wants to create something, generate appropriate code and include it in your response like this:
{
  "reply": "Here's your application! I've created...",
  "code": "<html>...</html>"  // only include if generating code
}
</format>`,data:userMessage})});const data=await response.json();if(data.code){appFrame.style.display='block';const appDoc=appFrame.contentWindow.document;appDoc.open();appDoc.write(data.code);appDoc.close()}await addMessage(data.reply,'ai')}catch(error){await addMessage('Sorry, I encountered an error. Please try again.','ai')}thinking.style.display='none'}document.getElementById('generateBtn').addEventListener('click',async function(){const promptText=promptInput.value.trim();if(!promptText)return;await addMessage(promptText);promptInput.value='';await generateResponse(promptText)});promptInput.addEventListener('keypress',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('generateBtn').click()}});</script><script defer src="https://static.cloudflareinsights.com/beacon.min.js/vcd15cbe7772f49c399c6a5babf22c1241717689176015" integrity="sha512-ZpsOmlRQV6y907TI0dKBHq9Md29nnaEIPlkf84rnaERnq6zvWvPUqr2ft8M1aS28oN72PdrCzSjY4U6VaAw1EQ==" data-cf-beacon='{"rayId":"9e4a5263bca0cf5a","version":"2025.9.1","serverTiming":{"name":{"cfExtPri":true,"cfEdge":true,"cfOrigin":true,"cfL4":true,"cfSpeedBrain":true,"cfCacheStatus":true}},"token":"4c6229722a6346bc8eb5cb0e5eae5d41","b":1}' crossorigin="anonymous"></script>
